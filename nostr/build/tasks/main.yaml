---

- name: ensure build work dir exists
  become: yes
  file:
    path: "{{build_work_dir}}"
    state: "directory"
    owner: "{{ansible_user}}"
    group: "{{ansible_user}}"
    mode: "0755"

# The unversioned package tracks the release default (1.26 on 26.04) and
# provides /usr/bin/go itself, so no pinned version or hand symlink.
- name: install golang
  become: yes
  apt: name="golang-go"

- name: unarchive nostr relayer
  unarchive:
    remote_src: yes
    src: "{{relayer_tar}}"
    dest: "{{build_work_dir}}/"
    creates: "{{relayer_build_dir}}"

# update name
- name: update relayer nip11 name
  lineinfile:
    path: "{{relayer_main_src}}"
    regexp: "^(\\s*)return \"WhitelistedRelay\"$"
    line: "\\1return \"{{relayer_name}}\""
    backrefs: yes

# update nip11 relay info
- name: update relayer nip11 info
  lineinfile:
    path: "{{relayer_handler_src}}"
    regexp: "^(\\s*){{item.k}}(\\s*)(.*)$"
    line: "\\1{{item.k}}\\2\"{{item.v}}\","
    backrefs: yes
  loop:
    - {"k": "Description:", "v": "{{relayer_description}}"}
    - {"k": "PubKey:", "v": "{{relayer_admin_pubkey}}"}
    - {"k": "Contact:", "v": "{{relayer_admin_contact}}"}
    - {"k": "Version:", "v": "{{relayer_version}}"}

# disable logging of pings
- name: relayer disable ping logging
  lineinfile:
    path: "{{relayer_handler_src}}"
    regexp: "^(\\s*)(s\\.Log\\.Infof\\(\"pinging.*)$"
    line: "\\1//\\2"
    backrefs: yes
  loop:
    - {""}

- name: check if relayer build exists
  stat:
    path: "{{relayer_srv_dir}}/nostr-relayer-whitelisted-{{relayer_version}}.tar.gz"
  register: build_file

- name: build relayer
  command: "go build"
  args:
    chdir: "{{relayer_build_dir}}/examples/whitelisted"
  # Keep the Go caches on build_work_dir (the SSD) instead of the SD card.
  environment:
    GOPATH: "{{build_work_dir}}/.go"
    GOCACHE: "{{build_work_dir}}/.go-cache"
    GOMODCACHE: "{{build_work_dir}}/.go-mod"
  when: not build_file.stat.exists

- name: create build server dir
  become: yes
  file:
    path: "{{relayer_srv_dir}}"
    mode: "0755"
    state: "directory"

- name: stage relayer binary
  copy:
    remote_src: yes
    src: "{{relayer_build_dir}}/examples/whitelisted/whitelisted"
    dest: "{{relayer_build_dir}}/relayer"
    mode: "0755"
  when: not build_file.stat.exists

- name: create gz archive of relayer
  become: yes
  archive:
    path: "{{relayer_build_dir}}/relayer"
    dest: "{{relayer_srv_dir}}/nostr-relayer-whitelisted-{{relayer_version}}.tar.gz"
    format: "gz"
    # force a real tar for the single binary; the module otherwise gzips a lone
    # file into a bare .gz that the server's unarchive can't extract.
    force_archive: true
  when: not build_file.stat.exists
