---

minecraft_user: "minecraft"
minecraft_parent_dir: "/opt"
minecraft_motd: "A Minecraft Server"
minecraft_mem: "2G"
minecraft_seed: ""
minecraft_difficulty: "hard"
minecraft_whitelist: "true"
minecraft_view_distance: "10"
minecraft_world_name: "world"
minecraft_dir: "{{minecraft_parent_dir}}/minecraft/{{minecraft_world_name}}"
# paper is a spigot derivative
# version-check: https://papermc.io/downloads/paper
minecraft_paper_version: "1.21.11"
minecraft_paper_build: "132"

minecreat_plugins_enabled:
  - "dynmap"
  # - "geyser"

# https://www.reddit.com/r/Dynmap/
# version-check: http://dynmap.us/builds/dynmap/?C=M;O=D
minecraft_dynmap_version: "3.8"
minecraft_dynmap_url: "http://dynmap.us/builds/dynmap/Dynmap-{{minecraft_dynmap_version}}-spigot.jar"

# ci.opencollab.dev (old Jenkins CI) is retired; download.geysermc.org v2
# returns the download url and sha256 directly, same as fill.papermc.io
# above.
# version-check: https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest
minecraft_geyser_version: "2.12.1"
minecraft_geyser_build: "1273"
