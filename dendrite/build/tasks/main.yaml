---

- name: ensure build work dir exists
  become: yes
  file:
    path: "{{build_work_dir}}"
    state: "directory"
    owner: "{{ansible_user}}"
    group: "{{ansible_user}}"
    mode: "0755"

# The unversioned package tracks the release default (1.26 on 26.04) and
# provides /usr/bin/go itself, so no pinned version or hand symlink.
- name: install golang
  become: yes
  apt: name="golang-go"

- name: unarchive dendrite
  unarchive:
    remote_src: yes
    src: "{{dendrite_tar}}"
    dest: "{{build_work_dir}}/"
    creates: "{{dendrite_build_dir}}"

- name: create build dir
  file:
    path: "{{dendrite_build_dir}}/bin"
    mode: "0755"
    state: "directory"

- name: check if dendrite build exists
  stat:
    path: "{{dendrite_srv_dir}}/dendrite-{{dendrite_version}}.tar.gz"
  register: build_file

- name: build dendrite
  command: "go build -o bin/ ./cmd/..."
  args:
    chdir: "{{dendrite_build_dir}}"
  # Keep the Go caches on build_work_dir (the SSD) instead of the SD card.
  environment:
    GOPATH: "{{build_work_dir}}/.go"
    GOCACHE: "{{build_work_dir}}/.go-cache"
    GOMODCACHE: "{{build_work_dir}}/.go-mod"
  when: not build_file.stat.exists

- name: create build server dir
  become: yes
  file:
    path: "{{dendrite_srv_dir}}"
    mode: "0755"
    state: "directory"

- name: create a gz archive of dendrite bins
  become: yes
  archive:
    path: "{{dendrite_build_dir}}/bin/*"
    exclude_path:
      - "{{dendrite_build_dir}}/bin/dendrite-demo-pinecone"
      - "{{dendrite_build_dir}}/bin/dendrite-demo-yggdrasil"
      - "{{dendrite_build_dir}}/bin/furl"
    dest: "{{dendrite_srv_dir}}/dendrite-{{dendrite_version}}.tar.gz"
    format: "gz"
  when: not build_file.stat.exists
